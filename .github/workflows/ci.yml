name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit, component and accessibility tests
        run: npm test
      - name: Build web app
        run: npm run build
      - name: Check design system CSS reached the app
        run: npm run check:css
      - name: Build Storybook
        run: npm run build-storybook
      - name: Upload Storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: packages/ui/storybook-static
          retention-days: 14
